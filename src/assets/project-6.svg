<?xml version="1.0" encoding="UTF-8"?>
<svg width="800" height="480" viewBox="0 0 800 480" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bgGrad_studio6" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#16133d" />
      <stop offset="100%" stop-color="#08061a" />
    </linearGradient>

    <!-- Accent Gradient -->
    <linearGradient id="accGrad_studio6" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#8b5cf6" />
      <stop offset="100%" stop-color="#14b8a6" />
    </linearGradient>

    <!-- Glow Filter -->
    <filter id="glow_studio6" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="16" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>

    <!-- Ambient Blur Filter -->
    <filter id="ambient_studio6" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="60" />
    </filter>

    <!-- Background Pattern -->
    <pattern id="pat_studio6" width="36" height="36" patternUnits="userSpaceOnUse">
      <path d="M 36 0 L 0 0 0 36" fill="none" stroke="rgba(255,255,255,0.06)" stroke-width="1"/>
    </pattern>
  </defs>

  <!-- Background Base -->
  <rect width="800" height="480" fill="url(#bgGrad_studio6)" />
  <rect width="800" height="480" fill="url(#pat_studio6)" />

  <!-- Luminous Ambient Orbs -->
  <circle cx="680" cy="100" r="220" fill="#8b5cf6" opacity="0.32" filter="url(#ambient_studio6)" />
  <circle cx="120" cy="380" r="200" fill="#14b8a6" opacity="0.25" filter="url(#ambient_studio6)" />
  <circle cx="400" cy="240" r="140" fill="#a78bfa" opacity="0.2" filter="url(#ambient_studio6)" />

  <!-- Central Artwork Geometry -->
  
      <!-- Kinetic Lab Kinetic Prism -->
      <g transform="translate(400, 240)">
        <rect x="-140" y="-140" width="280" height="280" rx="65" fill="none" stroke="url(#accGrad_studio6)" stroke-width="3" opacity="0.65" transform="rotate(15)" />
        <rect x="-105" y="-105" width="210" height="210" rx="48" fill="rgba(255,255,255,0.05)" stroke="rgba(255,255,255,0.25)" stroke-width="2" transform="rotate(-15)" />
        <circle cx="0" cy="0" r="48" fill="url(#accGrad_studio6)" opacity="0.95" filter="url(#glow_studio6)" />
        <circle cx="0" cy="0" r="20" fill="#ffffff" opacity="0.9" />
        <circle cx="-120" cy="-80" r="7" fill="#14b8a6" filter="url(#glow_studio6)" />
        <circle cx="120" cy="80" r="7" fill="#8b5cf6" filter="url(#glow_studio6)" />
      </g>
      <path d="M 0 310 C 240 180 380 420 580 270 C 690 190 750 320 800 240" fill="none" stroke="url(#accGrad_studio6)" stroke-width="3.5" opacity="0.7" />
    
</svg>