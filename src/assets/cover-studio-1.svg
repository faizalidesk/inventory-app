<?xml version="1.0" encoding="UTF-8"?>
<svg width="800" height="480" viewBox="0 0 800 480" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bgGrad_studio1" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1f1042" />
      <stop offset="100%" stop-color="#0b041a" />
    </linearGradient>

    <!-- Accent Gradient -->
    <linearGradient id="accGrad_studio1" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#9d7cff" />
      <stop offset="100%" stop-color="#73e6ce" />
    </linearGradient>

    <!-- Glow Filter -->
    <filter id="glow_studio1" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="16" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>

    <!-- Ambient Blur Filter -->
    <filter id="ambient_studio1" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="60" />
    </filter>

    <!-- Background Pattern -->
    <pattern id="pat_studio1" width="36" height="36" patternUnits="userSpaceOnUse">
      <path d="M 36 0 L 0 0 0 36" fill="none" stroke="rgba(255,255,255,0.06)" stroke-width="1"/>
    </pattern>
  </defs>

  <!-- Background Base -->
  <rect width="800" height="480" fill="url(#bgGrad_studio1)" />
  <rect width="800" height="480" fill="url(#pat_studio1)" />

  <!-- Luminous Ambient Orbs -->
  <circle cx="680" cy="100" r="220" fill="#9d7cff" opacity="0.32" filter="url(#ambient_studio1)" />
  <circle cx="120" cy="380" r="200" fill="#73e6ce" opacity="0.25" filter="url(#ambient_studio1)" />
  <circle cx="400" cy="240" r="140" fill="#c084fc" opacity="0.2" filter="url(#ambient_studio1)" />

  <!-- Central Artwork Geometry -->
  
      <!-- Concentric Orbital Portal -->
      <g transform="translate(400, 240)">
        <circle cx="0" cy="0" r="160" fill="none" stroke="url(#accGrad_studio1)" stroke-width="2" stroke-dasharray="8 8" opacity="0.4" />
        <circle cx="0" cy="0" r="125" fill="none" stroke="url(#accGrad_studio1)" stroke-width="3" opacity="0.75" />
        <rect x="-85" y="-85" width="170" height="170" rx="42" fill="rgba(255,255,255,0.04)" stroke="rgba(255,255,255,0.25)" stroke-width="2" transform="rotate(25)" />
        <circle cx="0" cy="0" r="48" fill="url(#accGrad_studio1)" opacity="0.9" filter="url(#glow_studio1)" />
        <circle cx="0" cy="0" r="24" fill="#ffffff" opacity="0.9" />
        <circle cx="-110" cy="-60" r="7" fill="#73e6ce" filter="url(#glow_studio1)" />
        <circle cx="110" cy="60" r="7" fill="#9d7cff" filter="url(#glow_studio1)" />
        <circle cx="60" cy="-110" r="5" fill="#ffffff" />
      </g>
      <!-- Fluid Wave Ribbons -->
      <path d="M 0 340 Q 200 220 400 360 T 800 260" fill="none" stroke="url(#accGrad_studio1)" stroke-width="3.5" opacity="0.6" />
      <path d="M 0 380 Q 240 270 480 400 T 800 310" fill="none" stroke="rgba(255,255,255,0.18)" stroke-width="1.5" />
    
</svg>