<?xml version="1.0" encoding="UTF-8"?>
<svg width="800" height="480" viewBox="0 0 800 480" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bgGrad_studio3" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#360c38" />
      <stop offset="100%" stop-color="#150317" />
    </linearGradient>

    <!-- Accent Gradient -->
    <linearGradient id="accGrad_studio3" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f43f5e" />
      <stop offset="100%" stop-color="#fb923c" />
    </linearGradient>

    <!-- Glow Filter -->
    <filter id="glow_studio3" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="16" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>

    <!-- Ambient Blur Filter -->
    <filter id="ambient_studio3" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="60" />
    </filter>

    <!-- Background Pattern -->
    <pattern id="pat_studio3" width="36" height="36" patternUnits="userSpaceOnUse">
      <path d="M 36 0 L 0 0 0 36" fill="none" stroke="rgba(255,255,255,0.06)" stroke-width="1"/>
    </pattern>
  </defs>

  <!-- Background Base -->
  <rect width="800" height="480" fill="url(#bgGrad_studio3)" />
  <rect width="800" height="480" fill="url(#pat_studio3)" />

  <!-- Luminous Ambient Orbs -->
  <circle cx="680" cy="100" r="220" fill="#f43f5e" opacity="0.32" filter="url(#ambient_studio3)" />
  <circle cx="120" cy="380" r="200" fill="#fb923c" opacity="0.25" filter="url(#ambient_studio3)" />
  <circle cx="400" cy="240" r="140" fill="#fda4af" opacity="0.2" filter="url(#ambient_studio3)" />

  <!-- Central Artwork Geometry -->
  
      <!-- Solar Geometric Disc Core -->
      <g transform="translate(400, 240)">
        <polygon points="0,-140 120,-70 120,70 0,140 -120,70 -120,-70" fill="none" stroke="url(#accGrad_studio3)" stroke-width="2.5" stroke-dasharray="10 6" opacity="0.5" />
        <circle cx="0" cy="0" r="100" fill="none" stroke="rgba(255,255,255,0.25)" stroke-width="2" />
        <rect x="-65" y="-65" width="130" height="130" rx="32" fill="rgba(255,255,255,0.05)" stroke="url(#accGrad_studio3)" stroke-width="2" transform="rotate(45)" />
        <circle cx="0" cy="0" r="44" fill="url(#accGrad_studio3)" opacity="0.95" filter="url(#glow_studio3)" />
        <circle cx="0" cy="0" r="18" fill="#ffffff" opacity="0.9" />
        <circle cx="-85" cy="-85" r="7" fill="#f43f5e" filter="url(#glow_studio3)" />
        <circle cx="85" cy="85" r="7" fill="#fb923c" filter="url(#glow_studio3)" />
      </g>
      <path d="M 0 370 Q 250 200 500 380 T 800 260" fill="none" stroke="url(#accGrad_studio3)" stroke-width="3" opacity="0.65" />
      <path d="M 0 410 Q 280 250 540 420 T 800 300" fill="none" stroke="rgba(255,255,255,0.15)" stroke-width="1.5" />
    
</svg>