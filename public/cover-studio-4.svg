<?xml version="1.0" encoding="UTF-8"?>
<svg width="800" height="480" viewBox="0 0 800 480" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bgGrad_studio4" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#092147" />
      <stop offset="100%" stop-color="#030d1f" />
    </linearGradient>

    <!-- Accent Gradient -->
    <linearGradient id="accGrad_studio4" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0ea5e9" />
      <stop offset="100%" stop-color="#a855f7" />
    </linearGradient>

    <!-- Glow Filter -->
    <filter id="glow_studio4" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="16" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>

    <!-- Ambient Blur Filter -->
    <filter id="ambient_studio4" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="60" />
    </filter>

    <!-- Background Pattern -->
    <pattern id="pat_studio4" width="36" height="36" patternUnits="userSpaceOnUse">
      <path d="M 36 0 L 0 0 0 36" fill="none" stroke="rgba(255,255,255,0.06)" stroke-width="1"/>
    </pattern>
  </defs>

  <!-- Background Base -->
  <rect width="800" height="480" fill="url(#bgGrad_studio4)" />
  <rect width="800" height="480" fill="url(#pat_studio4)" />

  <!-- Luminous Ambient Orbs -->
  <circle cx="680" cy="100" r="220" fill="#0ea5e9" opacity="0.32" filter="url(#ambient_studio4)" />
  <circle cx="120" cy="380" r="200" fill="#a855f7" opacity="0.25" filter="url(#ambient_studio4)" />
  <circle cx="400" cy="240" r="140" fill="#38bdf8" opacity="0.2" filter="url(#ambient_studio4)" />

  <!-- Central Artwork Geometry -->
  
      <!-- Neural Grid Lattice -->
      <g transform="translate(400, 240)">
        <ellipse cx="0" cy="0" rx="160" ry="90" fill="none" stroke="url(#accGrad_studio4)" stroke-width="2.5" opacity="0.6" transform="rotate(-20)" />
        <ellipse cx="0" cy="0" rx="160" ry="90" fill="none" stroke="rgba(255,255,255,0.2)" stroke-width="2" opacity="0.6" transform="rotate(20)" />
        <rect x="-80" y="-80" width="160" height="160" rx="36" fill="rgba(255,255,255,0.04)" stroke="url(#accGrad_studio4)" stroke-width="2" />
        <circle cx="0" cy="0" r="46" fill="url(#accGrad_studio4)" opacity="0.9" filter="url(#glow_studio4)" />
        <circle cx="0" cy="0" r="20" fill="#ffffff" opacity="0.9" />
        <circle cx="-140" cy="30" r="6" fill="#0ea5e9" filter="url(#glow_studio4)" />
        <circle cx="140" cy="-30" r="6" fill="#a855f7" filter="url(#glow_studio4)" />
      </g>
      <path d="M 0 330 C 220 220 340 430 550 280 C 680 180 740 330 800 240" fill="none" stroke="url(#accGrad_studio4)" stroke-width="3" opacity="0.6" />
    
</svg>