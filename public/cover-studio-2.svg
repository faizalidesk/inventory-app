<?xml version="1.0" encoding="UTF-8"?>
<svg width="800" height="480" viewBox="0 0 800 480" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bgGrad_studio2" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#072e25" />
      <stop offset="100%" stop-color="#021510" />
    </linearGradient>

    <!-- Accent Gradient -->
    <linearGradient id="accGrad_studio2" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#10b981" />
      <stop offset="100%" stop-color="#38bdf8" />
    </linearGradient>

    <!-- Glow Filter -->
    <filter id="glow_studio2" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="16" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>

    <!-- Ambient Blur Filter -->
    <filter id="ambient_studio2" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="60" />
    </filter>

    <!-- Background Pattern -->
    <pattern id="pat_studio2" width="36" height="36" patternUnits="userSpaceOnUse">
      <path d="M 36 0 L 0 0 0 36" fill="none" stroke="rgba(255,255,255,0.06)" stroke-width="1"/>
    </pattern>
  </defs>

  <!-- Background Base -->
  <rect width="800" height="480" fill="url(#bgGrad_studio2)" />
  <rect width="800" height="480" fill="url(#pat_studio2)" />

  <!-- Luminous Ambient Orbs -->
  <circle cx="680" cy="100" r="220" fill="#10b981" opacity="0.32" filter="url(#ambient_studio2)" />
  <circle cx="120" cy="380" r="200" fill="#38bdf8" opacity="0.25" filter="url(#ambient_studio2)" />
  <circle cx="400" cy="240" r="140" fill="#34d399" opacity="0.2" filter="url(#ambient_studio2)" />

  <!-- Central Artwork Geometry -->
  
      <!-- Bio-Circuit Conduit Portal -->
      <g transform="translate(400, 240)">
        <rect x="-150" y="-120" width="300" height="240" rx="70" fill="none" stroke="url(#accGrad_studio2)" stroke-width="3" opacity="0.6" />
        <rect x="-105" y="-85" width="210" height="170" rx="50" fill="rgba(255,255,255,0.04)" stroke="rgba(255,255,255,0.22)" stroke-width="2" />
        <circle cx="0" cy="0" r="48" fill="url(#accGrad_studio2)" opacity="0.95" filter="url(#glow_studio2)" />
        <circle cx="0" cy="0" r="20" fill="#ffffff" opacity="0.9" />
        <circle cx="-130" cy="0" r="6" fill="#38bdf8" filter="url(#glow_studio2)" />
        <circle cx="130" cy="0" r="6" fill="#10b981" filter="url(#glow_studio2)" />
        <circle cx="0" cy="-100" r="5" fill="#ffffff" />
        <circle cx="0" cy="100" r="5" fill="#38bdf8" />
      </g>
      <!-- Sine Wave Flow -->
      <path d="M 0 280 C 200 160 300 400 500 260 C 650 160 720 340 800 240" fill="none" stroke="url(#accGrad_studio2)" stroke-width="3" opacity="0.6" />
      <path d="M 0 320 C 180 200 320 440 520 300 C 660 200 740 380 800 280" fill="none" stroke="rgba(255,255,255,0.15)" stroke-width="1.5" />
    
</svg>